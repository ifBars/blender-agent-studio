name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - run: bun install --cwd plugins/blender-agent-studio --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: bun run check
      - run: bun run docs:assets
      - run: bun run docs:test
      - run: bun run docs:build
      - run: bun --cwd plugins/blender-agent-studio run setup:runtime
      - run: bun --cwd plugins/blender-agent-studio run test:runtime
      - run: bun run test
      - run: bun run test:python
