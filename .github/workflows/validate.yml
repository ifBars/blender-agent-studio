name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --cwd plugins/blender-agent-studio --frozen-lockfile
      - run: bun run check
      - run: bun run test
